<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusBank - Online Banking System</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>CampusBank</h1>
      <p>Online Banking System (College Project)</p>
    </header>

    <main class="container">
      <section class="card auth-card" id="authSection">
        <h2>Student Login</h2>
        <p class="muted">Use your student ID and password to enter your account.</p>
        <form id="loginForm">
          <label>
            Student ID
            <input type="text" id="studentId" placeholder="e.g. STU2026" required />
          </label>
          <label>
            Password
            <input type="password" id="password" placeholder="••••••••" required />
          </label>
          <button type="submit">Login</button>
        </form>
        <p class="hint">Demo credentials: <strong>STU2026</strong> / <strong>bank123</strong></p>
      </section>

      <section class="dashboard hidden" id="dashboardSection">
        <div class="grid">
          <article class="card">
            <h3>Account Summary</h3>
            <p class="balance" id="balance">₹0</p>
            <p class="muted">Account Number: <span id="accountNumber"></span></p>
          </article>

          <article class="card">
            <h3>Quick Transfer</h3>
            <form id="transferForm">
              <label>
                Recipient Name
                <input type="text" id="recipient" placeholder="Enter recipient name" required />
              </label>
              <label>
                Amount (₹)
                <input type="number" id="transferAmount" min="1" required />
              </label>
              <button type="submit">Send Money</button>
            </form>
          </article>

          <article class="card">
            <h3>Bill Payment</h3>
            <form id="billForm">
              <label>
                Bill Type
                <select id="billType" required>
                  <option value="">Select Bill</option>
                  <option>Electricity</option>
                  <option>Mobile Recharge</option>
                  <option>Internet</option>
                  <option>Water</option>
                </select>
              </label>
              <label>
                Amount (₹)
                <input type="number" id="billAmount" min="1" required />
              </label>
              <button type="submit">Pay Bill</button>
            </form>
          </article>

          <article class="card history-card">
            <div class="history-header">
              <h3>Recent Transactions</h3>
              <button id="logoutBtn" class="secondary">Logout</button>
            </div>
            <ul id="transactionList"></ul>
          </article>
        </div>
      </section>
    </main>

    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
  </body>
</html>
