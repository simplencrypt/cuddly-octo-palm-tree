<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusBank - Smart Student Banking</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-grid"></div>

    <header class="topbar glass">
      <h1>CampusBank</h1>
      <p>Modern online banking system for your college project</p>
    </header>

    <main class="container">
      <section class="glass auth-shell" id="authSection">
        <div class="tabs">
          <button class="tab active" data-tab="signup">Sign Up</button>
          <button class="tab" data-tab="login">Login</button>
        </div>

        <form id="signupForm" class="auth-form active">
          <h2>Create Account</h2>
          <label>
            Full Name
            <input type="text" id="signupName" placeholder="e.g. Ananya Singh" required />
          </label>
          <label>
            Age
            <input type="number" id="signupAge" min="16" max="90" required />
          </label>
          <label>
            Gender
            <select id="signupGender" required>
              <option value="">Select</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </label>
          <label>
            Email
            <input type="email" id="signupEmail" placeholder="you@example.com" required />
          </label>
          <label>
            Password
            <input type="password" id="signupPassword" minlength="6" required />
          </label>
          <button type="submit">Create Account & Send Confirmation</button>
        </form>

        <form id="loginForm" class="auth-form hidden">
          <h2>Welcome Back</h2>
          <label>
            Email
            <input type="email" id="loginEmail" placeholder="you@example.com" required />
          </label>
          <label>
            Password
            <input type="password" id="loginPassword" required />
          </label>
          <button type="submit">Login to Dashboard</button>
        </form>
      </section>

      <section class="dashboard hidden" id="dashboardSection">
        <div class="dashboard-grid">
          <article class="glass card profile-card">
            <h3>Account Summary</h3>
            <p class="name" id="profileName"></p>
            <p class="meta">Email: <span id="profileEmail"></span></p>
            <p class="meta">Age: <span id="profileAge"></span> | Gender: <span id="profileGender"></span></p>
            <p class="balance" id="balance">₹0</p>
            <p class="meta">Account Number: <span id="accountNumber"></span></p>
          </article>

          <article class="glass card">
            <h3>Quick Transfer</h3>
            <form id="transferForm">
              <label>
                Recipient Name
                <input type="text" id="recipient" required />
              </label>
              <label>
                Amount (₹)
                <input type="number" id="transferAmount" min="1" required />
              </label>
              <button type="submit">Send Money</button>
            </form>
          </article>

          <article class="glass card history-card">
            <div class="history-head">
              <h3>Recent Transactions</h3>
              <button id="logoutBtn" class="secondary" type="button">Logout</button>
            </div>
            <ul id="transactionList"></ul>
          </article>
        </div>
      </section>
    </main>

    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
  </body>
</html>
